[project]
name = "manga-ocr-better-synth"
version = "0.2.0"
description = "Synthetic data generator and dataset creation toolkit for Japanese manga OCR"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "albumentations>=1.1.0",
    "budoux>=0.1.0",
    "datasets>=2.0.0",
    "fire>=0.4.0",
    "fonttools>=4.30.0",
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "pandas>=1.3.0",
    "pillow>=9.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
kana = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "requests>=2.28.0",
]
scoring = [
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.40.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["manga_ocr_dev*"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.pytest.ini_options]
testpaths = ["tests", "manga_ocr_dev"]